<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Péndulo Invertido</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--txt:#e6e8ee;--sub:#8b90a0;--line:#2a2e38;--acc:#4ea1ff;--ok:#3ecf8e;--warn:#f5b041;--bad:#ff5d5d;--th:#4ea1ff;--x:#3ecf8e;--xr:#8b90a0;--a:#f5b041}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
#con{font-size:13px;color:var(--sub)}
#con.on{color:var(--ok)}
main{padding:12px 16px;display:grid;gap:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sub)}
#est{font-weight:700;font-size:15px}
.est-BALANCE{color:var(--ok)}.est-FALLA{color:var(--bad)}.est-LISTO,.est-HOMING{color:var(--warn)}
canvas{width:100%;height:120px;display:block}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:4px 2px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:#232733;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px 6px;font-size:15px}
button:active{background:#2e3443}
button.on{border-color:var(--acc);color:var(--acc)}
#stop{grid-column:1/-1;background:var(--bad);border:none;color:#fff;font-weight:700;font-size:17px;padding:16px}
input[type=range]{width:100%}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kgrid input{width:100%;background:#232733;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:14px;text-align:center}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}
#log{height:110px;overflow:auto;font:12px/1.35 ui-monospace,Menlo,monospace;color:var(--sub);white-space:pre-wrap}
small{color:var(--sub)}
@media(max-width:480px){.stats b{font-size:17px}}
</style>
</head>
<body>
<header><h1>Péndulo invertido</h1><span id="con">desconectado</span></header>
<main>
  <section class="card">
    <div class="stats">
      <div><span>Estado</span><b id="est">—</b></div>
      <div><span>θ [°]</span><b id="vth">—</b></div>
      <div><span>x [mm]</span><b id="vx">—</b></div>
      <div><span>a [m/s²]</span><b id="va">—</b></div>
    </div>
  </section>

  <section class="card">
    <div class="lbl"><span style="color:var(--th)">θ [°]</span><small id="hz">0 Hz</small></div>
    <canvas id="cth"></canvas>
    <div class="lbl"><span><span style="color:var(--x)">x</span> / <span style="color:var(--xr)">x ref</span> [mm]</span></div>
    <canvas id="cx"></canvas>
    <div class="lbl"><span style="color:var(--a)">a [m/s²]</span></div>
    <canvas id="ca"></canvas>
  </section>

  <section class="card btns">
    <button id="stop" onclick="tx('d')">DESHABILITAR</button>
    <button onclick="tx('h')">Homing</button>
    <button onclick="tx('z')">x = 0 aquí</button>
    <button onclick="tx('e')">Habilitar</button>
    <button onclick="tx('c')">Calibrar θ</button>
    <button id="bw" onclick="onda()">Onda □</button>
    <button onclick="tx('i')">Info</button>
  </section>

  <section class="card">
    <div class="lbl"><span>Referencia x</span><b id="vref">0 mm</b></div>
    <input id="ref" type="range" min="-150" max="150" step="5" value="0">
  </section>

  <section class="card">
    <div class="lbl"><span>Ganancias LQR  K = [x, v, θ, ω]</span></div>
    <div class="kgrid">
      <input id="k0" inputmode="decimal"><input id="k1" inputmode="decimal">
      <input id="k2" inputmode="decimal"><input id="k3" inputmode="decimal">
    </div>
    <div class="row"><button onclick="tx('i')">Leer</button><button onclick="enviarK()">Enviar K</button></div>
  </section>

  <section class="card">
    <div class="row" style="margin-top:0"><button id="brec" onclick="grabar()">● Grabar</button><button onclick="csv()">Descargar CSV</button></div>
    <small id="nrec">0 muestras</small>
  </section>

  <section class="card"><div id="log"></div></section>
</main>
<script>
const EST=['INACTIVO','HOMING','LISTO','BALANCE','FALLA'];
const VENT=10000, N=1200;
const d={t:[],x:[],xr:[],th:[],a:[]};
let ws, rec=null, ondaOn=false, cuenta=0, tHz=performance.now();
const $=id=>document.getElementById(id);

function conectar(){
  ws=new WebSocket('ws://'+(location.hostname||'192.168.4.1')+':81/');
  ws.onopen=()=>{$('con').textContent='conectado';$('con').className='on'};
  ws.onclose=()=>{$('con').textContent='desconectado';$('con').className='';setTimeout(conectar,1000)};
  ws.onmessage=e=>{
    const m=e.data;
    if(m[0]==='T') datos(m.slice(1)); else if(m[0]==='M') mensaje(m.slice(1));
  };
}
function tx(c){if(ws&&ws.readyState===1){ws.send(c);if(c!=='i')log('> '+c)}}

function datos(s){
  for(const l of s.split('\n')){
    const f=l.split(',');
    if(f.length!==8) continue;
    const v=f.map(Number);
    if(v.some(isNaN)) continue;
    const [t,x,,th,,a,xr,st]=v;
    d.t.push(t);d.x.push(x*1000);d.xr.push(xr*1000);d.th.push(th*180/Math.PI);d.a.push(a);
    if(d.t.length>N) for(const k in d) d[k].shift();
    if(rec) rec.push(l);
    cuenta++;
    $('est').textContent=EST[st]||st;$('est').className='est-'+(EST[st]||'');
  }
  const i=d.t.length-1;
  if(i>=0){$('vth').textContent=d.th[i].toFixed(2);$('vx').textContent=d.x[i].toFixed(1);$('va').textContent=d.a[i].toFixed(2)}
  if(rec) $('nrec').textContent=rec.length+' muestras';
}
function mensaje(s){
  if(s.startsWith('#K=')){
    s.slice(3).split(',').forEach((k,i)=>{const e=$('k'+i);if(e&&document.activeElement!==e)e.value=parseFloat(k)});
  }
  log(s);
}
function log(s){const L=$('log');L.textContent+=s+'\n';if(L.textContent.length>6000)L.textContent=L.textContent.slice(-4000);L.scrollTop=L.scrollHeight}

function onda(){ondaOn=!ondaOn;$('bw').classList.toggle('on',ondaOn);tx('w')}
$('ref').oninput=e=>{$('vref').textContent=e.target.value+' mm'};
$('ref').onchange=e=>{tx('r'+(e.target.value/1000).toFixed(3));if(ondaOn){ondaOn=false;$('bw').classList.remove('on')}};
function enviarK(){
  const k=[0,1,2,3].map(i=>parseFloat($('k'+i).value));
  if(k.some(isNaN)){log('# K inválida');return}
  tx('k'+k.join(','));
}
function grabar(){
  if(rec){$('brec').textContent='● Grabar';$('brec').classList.remove('on');$('nrec').textContent=rec.length+' muestras (detenido)';window._ult=rec;rec=null}
  else{rec=[];$('brec').textContent='■ Detener';$('brec').classList.add('on')}
}
function csv(){
  const r=rec||window._ult;if(!r||!r.length){log('# nada grabado');return}
  const b=new Blob(['t_ms,x,v,theta,omega,a,x_ref,estado\n'+r.join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(b),A=document.createElement('a');
  A.href=u;A.download='pendulo_'+Date.now()+'.csv';A.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function plot(id,series,minSpan){
  const c=$(id),r=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  if(c.width!==W*r||c.height!==H*r){c.width=W*r;c.height=H*r}
  const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,W,H);
  const n=d.t.length;if(!n)return;
  const t1=d.t[n-1],t0=t1-VENT;
  let lo=Infinity,hi=-Infinity;
  for(const[s]of series)for(let i=0;i<n;i++){const v=d[s][i];if(v<lo)lo=v;if(v>hi)hi=v}
  const m=(lo+hi)/2,sp=Math.max(hi-lo,minSpan)*0.55;lo=m-sp;hi=m+sp;
  const X=t=>(t-t0)/VENT*W,Y=v=>H-(v-lo)/(hi-lo)*H;
  g.strokeStyle='#2a2e38';g.lineWidth=1;g.beginPath();
  if(lo<0&&hi>0){g.moveTo(0,Y(0));g.lineTo(W,Y(0))}g.stroke();
  g.fillStyle='#8b90a0';g.font='11px system-ui';g.fillText(hi.toFixed(1),4,12);g.fillText(lo.toFixed(1),4,H-4);
  for(const[s,col,dash]of series){
    g.strokeStyle=col;g.lineWidth=1.6;g.setLineDash(dash?[4,4]:[]);g.beginPath();
    for(let i=0;i<n;i++){const px=X(d.t[i]),py=Y(d[s][i]);i?g.lineTo(px,py):g.moveTo(px,py)}
    g.stroke();
  }
  g.setLineDash([]);
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function dibujar(){
  plot('cth',[['th',css('--th')]],2);
  plot('cx',[['xr',css('--xr'),1],['x',css('--x')]],20);
  plot('ca',[['a',css('--a')]],1);
  const now=performance.now();
  if(now-tHz>1000){$('hz').textContent=Math.round(cuenta*1000/(now-tHz))+' Hz';cuenta=0;tHz=now}
  requestAnimationFrame(dibujar);
}
conectar();dibujar();
</script>
</body>
</html>
